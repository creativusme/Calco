# Xcode project definition (XcodeGen). The .xcodeproj is generated in CI, never committed.
name: Calco
options:
  bundleIdPrefix: app.calco
  deploymentTarget:
    iOS: "17.0"
targets:
  Calco:
    type: application
    platform: iOS
    sources: [Calco]
    info:
      path: Calco/Info.plist
      properties:
        CFBundleDisplayName: Calco
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Calco uses the camera and LiDAR to scan objects in 3D.
        NSLocalNetworkUsageDescription: Calco sends your scans to the Calco app on your computer over the local network.
        NSMotionUsageDescription: Calco takes close-up photos automatically when the phone is held still.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calco.capture
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

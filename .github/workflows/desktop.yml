name: Desktop app

# The complete Windows installer: native window + the engine with everything it needs (Python,
# libraries, COLMAP, OpenMVS). Nothing else to install, no commands to type.
on:
  push:
    paths: ["desktop/**", "engine/**", "docs/collaudo.md", "tools/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the installer as a release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the UI
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Build the bundled runtime (Python + engine + COLMAP + OpenMVS)
        run: |
          python -m pip install -q uv
          python desktop/scripts/build_runtime.py
      - name: Check the bundled engine starts and finds its tools
        shell: bash
        run: |
          export CALCO_HOME="$PWD/desktop/src-tauri/runtime" PYTHONNOUSERSITE=1
          "$CALCO_HOME/python/python.exe" -c "from calco import tools, paths, server; s = tools.status(); print(s); assert s['openmvs'] and s['colmap_cuda'], s; assert paths.ui_dir().joinpath('index.html').exists()"
      - name: Build the installer (Tauri, NSIS)
        working-directory: desktop
        run: npx tauri build
      - name: Collect the installer
        shell: bash
        run: |
          exe=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$exe" Calco-setup.exe
          ls -la Calco-setup.exe
      - name: Publish (download link in the README)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create desktop-latest Calco-setup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Calco for Windows" --latest=false \
            --notes "Complete installer built from ${GITHUB_SHA::7}: app, engine, Python, COLMAP and OpenMVS included. Run it, then open Calco from the Start menu. The optional Gaussian-splat engine (about 3 GB) is downloaded by the app itself on computers with an NVIDIA GPU."

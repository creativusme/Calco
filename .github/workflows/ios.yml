name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the IPA as the latest release

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Calco.xcodeproj -scheme Calco -configuration Release -sdk iphoneos             -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build             2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Report compile errors as annotations
        if: failure()
        run: |
          cd ios
          grep -E "^/.*:[0-9]+:[0-9]+: error:" build.log | sort -u | head -30 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s#^$GITHUB_WORKSPACE/##")
            echo "::error file=$file,line=$(echo "$line" | cut -d: -f2)::$(echo "$line" | cut -d: -f4-)"
          done
          grep -E "error:" build.log | grep -vE "^/" | sort -u | head -8 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Package IPA for sideloading
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload && cp -R Calco.app Payload/
          zip -qry Calco-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Calco-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/Calco-unsigned.ipa
      - name: Publish as the latest release (download link on the repository page)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep CFBundleShortVersionString ios/project.yml | cut -d'"' -f2)
          cd ios/build/Build/Products/Release-iphoneos
          gh release delete ios-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create ios-latest Calco-unsigned.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Calco for iPhone $version" --latest \
            --notes "Unsigned IPA built from ${GITHUB_SHA::7}. Install it with Sideloadly (it signs the app with your Apple ID)."

name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project Calco.xcodeproj -scheme Calco -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA for sideloading
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload && cp -R Calco.app Payload/
          zip -qry Calco-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Calco-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/Calco-unsigned.ipa

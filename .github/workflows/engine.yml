name: Engine tests

on:
  push:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "engine[dev]"
      - name: Test
        run: python -m pytest -q engine/tests
